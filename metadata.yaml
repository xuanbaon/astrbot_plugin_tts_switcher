name: astrbot_plugin_tts_switcher
display_name: TTS 声线切换
short_desc: 群里发 /tts 示例 换声线，/说=示例 你好 念一句，/答=示例 今天天气 用该声线回复一句
desc: >-
  AstrBot 的会话级 TTS 只能在面板里逐个会话点选，日常想换个声音得开面板翻半天。
  这个插件把「名字 → TTS 提供商」的映射放进插件配置页（每条可以写备注，方便区分
  同名声线），之后在聊天里发 /tts 示例 就切过去了，即时生效、不用重启核心。
  还支持两条一次性指令：/说=示例 今天风很好 用指定声线念一句话；/答=示例 今天天气怎么样
  让机器人用指定声线回复这一句，回完自动恢复原来的声线，后面的对话不受影响。
  支持别名、完全对应优先+同基名自动取靠前档位的模糊匹配、分级权限、会话级语音开关，/ttshelp 随时查用法，也会附到 /help 末尾。
  WebUI 里的「声线控制台」会自动读取「模型供应商」中所有文字转语音提供商的音色并加载成声线，
  供应商改名或删掉时旧声线会被标出来一键改绑；页面里还能改名字、别名、备注、指令参数并试听。
  本地 GPT-SoVITS、云端通义、OpenAI、Edge 等任何已启用的语音合成提供商都能挂上去。
help: |-
  /ttshelp        看完整用法（也会附在 /help 末尾）
  /tts            看当前用的是哪个声线
  /tts 列表       列出所有可用声线（含备注）
  /tts <名字>     切换声线，例如 /tts 示例
  /tts 默认       清掉本会话设置，回到全局默认
  /tts 关闭       本会话不再合成语音
  /tts 开启       恢复本会话语音
  /tts 引擎       列出所有 TTS 提供商 id（配置映射时用）
  /说 <文本>           用当前声线念一句，例如 /说 今天风很好
  /说=<声线> <文本>    用某个声线念一句（一次性，不改当前设置），例如 /说=示例 今天风很好
  /答 <文本>           用当前声线回复一句
  /答=<声线> <文本>    用某个声线回复一句（一次性，回完自动切回），例如 /答=示例 今天天气怎么样
  指定声线必须带等号：不带等号时整段都当正文，/说 示例 你好 会把「示例 你好」一起念出来
  等号：半角 = 与全角 ＝ 都行；等号后面的名字与正文之间认空格、半角逗号 ,、全角逗号 ，、冒号、顿号、竖线
  名字怎么找：完全对应优先；没有就模糊搜，同一条声线的不同档（flash/plus）取靠前那个，
  命中多个不同名字会让你写全，都没命中才提示「没找到声线」
  WebUI 左侧「拓展功能 → 声线控制台」可以自动加载供应商声线，并改名字、别名、备注和指令参数
